test:
  message: Hello from Gym Config Server



spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gymdb
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


management:
  endpoints:
    web:
      exposure:
        include: health,info